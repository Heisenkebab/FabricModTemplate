name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon runs on 25; each version's toolchain is provisioned by Gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all Minecraft versions
        run: ./gradlew buildAndCollect

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/
