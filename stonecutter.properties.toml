# Shared properties for all Minecraft versions
mod.id = "template"
mod.name = "ModTemplate"
mod.group = "net.heisenkebab"
mod.version = "1.0.0"

deps.fabric_loader = "0.20.1"
loomx.loom_version = "1.19.3"

# Optional Kotlin support; the Kotlin plugin version in settings.gradle.kts must match
mod.kotlin = false
deps.fabric_kotlin = "1.14.2+kotlin.2.4.21"

# Publishing project ids; leave a platform empty to skip it
publish.modrinth_id = ""
publish.curseforge_id = ""

# Per-version properties: check https://fabricmc.net/develop for matching versions
["1.21.11"]
# Minecraft range written into fabric.mod.json
mod.mc_compat = "1.21.11"
# Game versions to tag uploads with on Modrinth/CurseForge
mod.mc_releases = ["1.21.11"]

deps.fabric_api = "0.141.6+1.21.11"

["26.3"]
mod.mc_compat = "26.3"
mod.mc_releases = ["26.3"]

deps.fabric_api = "0.166.2+26.3"
